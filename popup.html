<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CookieJab</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>CookieJab</h1>
    <div class="header-actions">
      <button id="visibility-btn" type="button" class="icon-only" aria-pressed="true" title="Show values">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
          <line class="eye-slash" x1="2" y1="2" x2="22" y2="22"/>
        </svg>
      </button>
      <div class="split-btn">
        <button id="add-btn">Add rule</button>
        <button id="import-btn" type="button" title="More ways to add a rule: import from a curl command">
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <p id="last-error" class="banner error" hidden></p>

  <form id="rule-form" hidden>
    <input type="hidden" id="rule-id" />
    <div class="row">
      <label class="grow">Bundle
        <input id="f-bundle" placeholder="Staging (optional)" />
      </label>
      <label>Type
        <input type="hidden" id="f-type" value="header" />
        <div class="seg" role="group" aria-label="Rule type">
          <button type="button" class="type-header" data-type="header" aria-pressed="true">Header</button>
          <button type="button" class="type-cookie" data-type="cookie" aria-pressed="false">Cookie</button>
        </div>
      </label>
    </div>
    <div class="row">
      <label class="grow">Match pattern
        <input id="f-url" class="mono" placeholder="*://*.example.com/*" />
      </label>
    </div>
    <p id="f-url-hint" class="hint"></p>
    <p id="f-url-override" class="hint warn" hidden></p>
    <div class="row">
      <label class="grow">Key
        <input id="f-key" class="mono" placeholder="Authorization / session_id" />
      </label>
      <label class="grow">Value
        <input id="f-value" class="mono" placeholder="Bearer ... / abc123" />
      </label>
    </div>
    <p id="form-error" class="error" hidden></p>
    <div class="row actions">
      <button type="submit" class="primary type-header" id="save-btn">Save</button>
      <button type="button" id="cancel-btn">Cancel</button>
    </div>
  </form>

  <form id="bundle-form" hidden>
    <input type="hidden" id="b-old-name" />
    <div class="row">
      <label class="grow">Bundle name
        <input id="b-name" placeholder="Staging" />
      </label>
    </div>
    <div class="row">
      <label class="grow">Bundle match pattern
        <input id="b-url" class="mono" placeholder="*://*.example.com/*" />
      </label>
    </div>
    <p class="hint">Optional. Replaces the match pattern of every rule in this bundle.</p>
    <p id="bundle-form-error" class="error" hidden></p>
    <div class="row actions">
      <button type="submit" class="primary" id="bundle-save-btn">Save</button>
      <button type="button" id="bundle-cancel-btn">Cancel</button>
    </div>
  </form>

  <div id="import-paste" hidden>
    <p class="hint">Paste a curl command. CookieJab finds its headers and cookies.</p>
    <textarea id="import-text" class="mono" rows="6" placeholder="curl 'https://example.com/api' -H 'Authorization: Bearer ...'"></textarea>
    <p id="import-paste-error" class="error" hidden></p>
    <div class="row actions">
      <button type="button" id="import-paste-btn">Paste</button>
      <button type="button" class="primary" id="import-parse-btn">Continue</button>
      <button type="button" id="import-paste-cancel-btn">Cancel</button>
    </div>
  </div>

  <div id="import-preview" hidden>
    <div class="row">
      <label class="grow">Match pattern
        <input id="import-url" class="mono" placeholder="*://example.com/*" />
      </label>
    </div>
    <p id="import-url-error" class="error" hidden></p>
    <input id="import-filter" placeholder="Filter by name" />
    <ul id="import-items"></ul>
    <div class="row">
      <label class="grow">Import into
        <select id="import-dest"></select>
      </label>
    </div>
    <div class="row" id="import-new-name-row">
      <label class="grow">New bundle name
        <input id="import-new-name" placeholder="Imported" />
      </label>
    </div>
    <p id="import-preview-error" class="error" hidden></p>
    <div class="row actions">
      <button type="button" id="import-back-btn">Back</button>
      <button type="button" class="primary" id="import-confirm-btn" disabled>Import</button>
    </div>
  </div>

  <ul id="rule-list"></ul>
  <p id="empty" class="empty" hidden>No rules yet. Click Add rule to create one.</p>

  <script type="module" src="popup.js"></script>
</body>
</html>
