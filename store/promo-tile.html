<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: 0 32px;
    display: flex; align-items: center; gap: 26px;
    background: linear-gradient(135deg, #1e1e24 0%, #2a2a33 100%);
    color: #e6e6ea;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
  }
  img { width: 120px; height: 120px; flex: none; }
  h1 { margin: 0 0 6px; font-size: 36px; letter-spacing: -0.5px; }
  p { margin: 0 0 14px; color: #9a9aa8; font-size: 16px; }
  .tags span {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px; color: #1e1e24; margin-right: 6px;
  }
  .h { background: #7ad0a0; }
  .c { background: #f0a868; }
</style>
</head>
<body>
  <img src="icon-source-128.png" alt="">
  <div>
    <h1>CookieJab</h1>
    <p>Inject headers and cookies<br>per URL match pattern.</p>
    <div class="tags"><span class="h">header</span><span class="c">cookie</span></div>
  </div>
</body>
</html>
