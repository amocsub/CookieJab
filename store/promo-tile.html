    display: inline-block; font: 600 11px/1 ui-monospace, monospace; letter-spacing: 0.5px;
    border: 1px solid; padding: 2px 8px; border-radius: 2px; margin-right: 6px;

  .h { color: #cb8b3e; border-color: #cb8b3e; }

  <img src="icon-source-128.png" alt="">
